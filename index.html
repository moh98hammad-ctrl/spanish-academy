<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل في الأكاديمية الإسبانية لكرة القدم</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans py-10">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-900">الأكاديمية الإسبانية لكرة القدم</h1>
            <p class="text-gray-500 text-sm mt-2">استمارة تسجيل لاعب جديد</p>
        </div>
        <form id="registrationForm" onsubmit="submitRegistration(event)" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">اسم اللاعب الرباعي</label>
                <input type="text" id="fullName" required class="w-full px-4 py-2 border rounded-lg focus:outline-none">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">تاريخ الميلاد</label>
                    <input type="date" id="birthDate" required class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">مكان السكن (المنطقة)</label>
                    <input type="text" id="address" required class="w-full px-4 py-2 border rounded-lg focus:outline-none" placeholder="مثال: عمان">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">اسم ولي الأمر</label>
                    <input type="text" id="parentName" required class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">رقم هاتف ولي الأمر</label>
                    <input type="text" id="parentPhone" required class="w-full px-4 py-2 border rounded-lg focus:outline-none" placeholder="962790000000+">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">الطول (سم)</label>
                    <input type="number" id="height" class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">الوزن (كغ)</label>
                    <input type="number" id="weight" class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-1">خدمة المواصلات (التوصيل للملعب)</label>
                <select id="transport" class="w-full px-4 py-2 border rounded-lg bg-white">
                    <option value="no" id="optNo">بدون توصيل</option>
                    <option value="yes" id="optYes">مع توصيل</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 mt-6">إرسال طلب التسجيل</button>
        </form>
        <div id="successMessage" class="hidden mt-6 p-4 bg-green-100 text-green-700 rounded-lg text-center font-semibold">
            تم إرسال طلب التسجيل بنجاح!
        </div>
    </div>
    <script>
        // جلب الأسعار المحدثة من التخزين أو وضع أسعار افتراضية
        let prices = JSON.parse(localStorage.getItem('academy_prices')) || { base: 50, transport: 25 };

        function loadPricesText() {
            document.getElementById('optNo').innerText = `بدون توصيل (اشتراك أساسي: ${prices.base} دينار)`;
            document.getElementById('optYes').innerText = `مع توصيل (الاشتراك + التوصيل: ${prices.base + prices.transport} دينار)`;
        }

        function submitRegistration(event) {
            event.preventDefault();
            const transportVal = document.getElementById('transport').value;
            const totalFees = transportVal === 'yes' ? (prices.base + prices.transport) : prices.base;

            const birthDate = document.getElementById('birthDate').value;
            const currentYear = new Date().getFullYear();
            const birthYear = new Date(birthDate).getFullYear();
            const age = currentYear - birthYear;

            let ageGroup = 'أخرى';
            if (age >= 6 && age <= 8) ageGroup = '6-8';
            else if (age >= 9 && age <= 11) ageGroup = '9-11';
            else if (age >= 12 && age <= 14) ageGroup = '12-14';
            else if (age >= 15 && age <= 16) ageGroup = '15-16';

            const player = {
                id: Date.now(),
                fullName: document.getElementById('fullName').value,
                birthDate,
                ageGroup,
                address: document.getElementById('address').value,
                parentName: document.getElementById('parentName').value,
                parentPhone: document.getElementById('parentPhone').value,
                height: document.getElementById('height').value || '-',
                weight: document.getElementById('weight').value || '-',
                transport: transportVal === 'yes' ? 'مع توصيل' : 'بدون توصيل',
                totalFees: totalFees,
                paidFees: 0 // البداية لم يدفع شيئاً
            };

            let players = JSON.parse(localStorage.getItem('academy_players')) || [];
            players.push(player);
            localStorage.setItem('academy_players', JSON.stringify(players));

            document.getElementById('registrationForm').reset();
            document.getElementById('successMessage').classList.remove('hidden');
        }

        window.onload = loadPricesText;
    </script>
</body>
</html>
